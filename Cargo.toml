[workspace]
members = [
    "crates/mush-core",
    "crates/mish-midi-core",
    "crates/mash-audio-core",
    "crates/mish-shell",
    "crates/mash-shell",
    "crates/mush-shell",
    "crates/nu_plugin_midi",
    "crates/nu_plugin_live_audio",
    "crates/mush-commands",
    # TODO(#2): add for integration tests: 
    "tests",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
clap          = { version = "4", features = ["derive"] }
shlex         = "2"
reedline      = "0.52"
nu-plugin     = "0.116"
nu-protocol   = "0.116"
thiserror     = "2"
enum-iterator = "2"
cpal          = "0.18"
midir         = "0.11"
tokio         = { version = "1", features = ["full"] }
serde         = { version = "1", features = ["derive"] }
rmp-serde     = "1.3"
tmq           = "0.4"
crossbeam     = "0.8"
midly         = "0.5"
libc = "0.2"
# internal
mush-core   = { path = "crates/mush-core" }
mush-commands = { path = "crates/mush-commands" }
mish-midi-core   = { path = "crates/mish-midi-core" }
mash-audio-core   = { path = "crates/mash-audio-core" }
