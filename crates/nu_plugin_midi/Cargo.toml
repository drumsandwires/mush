[package]
name = "nu_plugin_midi"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
nu-plugin        = { workspace = true }
nu-protocol      = { workspace = true }
tokio            = { workspace = true }
anyhow           = { workspace = true }
tmq              = { workspace = true }
shadow-rs        = { workspace = true }
mush-core        = { workspace = true }
mush-midi-codec  = { workspace = true }
mush-tracing     = { workspace = true }

[build-dependencies]
shadow-rs = { workspace = true }

[dependencies.console-subscriber]
workspace = true
optional  = true

[features]
tokio-console = ["dep:console-subscriber", "mush-tracing/tokio-console"]
