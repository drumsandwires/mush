[package]
name = "mish-shell"
version.workspace = true
edition.workspace = true

[dependencies]
mush-core       = { workspace = true, features = ["reedline-shell"] }
mush-midi-codec = { workspace = true }
clap            = { workspace = true }
shlex           = { workspace = true }
tokio           = { workspace = true }
reedline        = { workspace = true }
shadow-rs       = { workspace = true }
tracing         = { workspace = true }
dirs            = { workspace = true }
mush-tracing    = { workspace = true, features = ["tokio-console"] }

[build-dependencies]
shadow-rs = { workspace = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "mish"
path = "src/main.rs"

[dependencies.console-subscriber]
workspace = true
optional  = true

[features]
tokio-console = ["dep:console-subscriber", "mush-tracing/tokio-console"]
