[package]
name = "nu_plugin_live_audio"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nu_plugin_live_audio"
path = "src/main.rs"

[dependencies]
nu-plugin   = { workspace = true }
nu-protocol = { workspace = true }
tokio       = { workspace = true }
anyhow      = { workspace = true }
shadow-rs      = { workspace = true }
tracing     = { workspace = true } 
mush-core   = { workspace = true }
mush-tracing = { workspace = true }

[build-dependencies]
shadow-rs = { workspace = true }

[dependencies.console-subscriber]
workspace = true
optional  = true

[features]
tokio-console = ["dep:console-subscriber", "mush-tracing/tokio-console"]
